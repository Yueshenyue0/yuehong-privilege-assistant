name: Build Yuehong APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1"; do
            echo ">>> install $pkg"
            "$SDKMGR" --install "$pkg" 2>&1 | tail -2 || echo "WARN: failed $pkg"
          done
          echo ">>> available platforms in repo:"
          "$SDKMGR" --list 2>/dev/null | grep -E 'platforms;android-3' || true
          echo ">>> try install platforms;android-37 across channels:"
          for ch in 0 1 2 3; do
            if "$SDKMGR" --install "platforms;android-37" --channel=$ch 2>&1 | tee /tmp/inst.log | grep -qi 'done\|100%'; then
              echo "installed with channel $ch"; break
            fi
            grep -o "Failed to find package.*" /tmp/inst.log || true
          done || true
          echo ">>> installed:"
          "$SDKMGR" --list_installed 2>/dev/null || true
          ls "$ANDROID_HOME/platforms" || true
          exit 0

      - name: Build release APK
        env:
          GRADLE_OPTS: -Xmx4096m -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :manager:assembleRelease --stacktrace --no-daemon

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p dist
          cp out/apk/*.apk dist/ 2>/dev/null || cp manager/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cp out/mapping/*.txt dist/ 2>/dev/null || true
          ls -lh dist || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuehong-privilege-assistant
          path: dist/
          if-no-files-found: warn
          retention-days: 30
