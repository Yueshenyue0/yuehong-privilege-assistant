name: Build Yuehong APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Build release APK
        env:
          GRADLE_OPTS: -Xmx4096m -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :manager:assembleRelease --stacktrace --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp out/apk/*.apk dist/ 2>/dev/null || cp manager/build/outputs/apk/release/*.apk dist/
          cp out/mapping/*.txt dist/ 2>/dev/null || true
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuehong-privilege-assistant
          path: dist/
          if-no-files-found: error
          retention-days: 30
